<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我们的回忆密室</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f6f9;
      overflow-x: hidden;
      position: relative;
    }

    /* 雪花 */
    .snowflake {
      position: fixed;
      top: -10%;
      color: #cbd5e1;
      font-size: 1rem;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.7;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* 点击爱心 */
    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 20px;
      color: #e8b4bc;
      animation: heartUp 0.8s ease forwards;
      z-index: 2;
    }

    @keyframes heartUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(1.3);
      }
    }

    /* 彩蛋弹窗 */
    .easter-egg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 99;
      align-items: center;
      justify-content: center;
    }

    .egg-text {
      color: #b81c24;
      font-size: clamp(1.8rem, 7vw, 3.5rem);
      font-weight: 900;
      text-align: center;
      padding: 24px;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* 场景 */
    .scene {
      display: none;
      min-height: 100vh;
      padding: 24px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      z-index: 3;
    }

    .scene.active {
      display: flex;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 8px 26px rgba(120, 135, 155, 0.14);
    }

    .title {
      font-size: 21px;
      color: #555b68;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }

    .desc {
      color: #747b8c;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 22px;
    }

    /* 场景 1 聊天框 */
    .chat-wrap {
      background: #f0f3f7;
      border-radius: 16px;
      padding: 16px;
      position: relative;
    }

    .msg {
      background: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      margin: 8px 0;
      font-size: 14px;
      color: #444;
    }

    .spot {
      position: absolute;
      right: 28px;
      bottom: 32px;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    /* 场景 2 地图 */
    .map-container {
      position: relative;
      height: 230px;
      background: #eef4fa;
      border-radius: 16px;
      overflow: hidden;
    }

    .point {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #9fb8d6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
    }

    .point.active {
      background: #648cb8;
      box-shadow: 0 0 12px #89b4e6;
    }

    .sh {
      top: 30%;
      left: 20%;
    }

    .sg {
      bottom: 25%;
      right: 22%;
    }

    .line {
      position: absolute;
      height: 2px;
      background: #648cb8;
      display: none;
    }

    .line.show {
      display: block;
      animation: draw 0.7s ease forwards;
    }

    @keyframes draw {
      from { width: 0; }
      to { width: 60%; }
    }

    /* 场景3 物品 */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .item {
      background: #f0f3f7;
      border-radius: 14px;
      padding: 16px 8px;
      text-align: center;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      transition: 0.3s;
    }

    .item.correct {
      background: #dce7f5;
      color: #3b6899;
    }

    /* 保险箱 */
    .safe-box {
      background: #444852;
      border-radius: 18px;
      padding: 26px;
      text-align: center;
    }

    .pwd-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .pwd-box {
      width: 56px;
      height: 64px;
      background: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #444;
    }

    .btn-group button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #7488a8;
      color: white;
      margin: 4px;
      cursor: pointer;
    }

    .end-img {
      width: 100%;
      border-radius: 16px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      background: #7488a8;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      opacity: 0.85;
    }

    .tip {
      margin-top: 12px;
      color: #949ba8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <audio id="bgm" loop preload="auto">
    <source src="https://www.w3schools.com/html/mov_bbb.mp3" type="audio/mpeg">
  

  <div class="easter-egg" id="eggModal">
    <div class="egg-text">你的生命中除了我不会再有其他女人了，我爱你</div>
  </div>

  <!-- 开场 -->
  <section class="scene active" id="s0">
    <div class="wrap">
      <div class="title">我们的回忆密室</div>
      <div class="desc">
        顺着回忆往前走，拼出藏在故事里的答案。
      </div>
      <button onclick="goNext('s0','s1')">开始</button>
    </div>
  </section>

  <!-- 场景 1 -->
  <section class="scene" id="s1">
    <div class="wrap">
      <div class="title">初遇</div>
      <div class="desc">当年对话框里，藏着第一个字。</div>
      <div class="chat-wrap">
        <div class="msg">好久不见</div>
        <div class="msg">很高兴再次遇见你</div>
        <div class="spot" id="spot1"></div>
      </div>
      <div class="tip" id="tip1"></div>
    </div>
  </section>

  <!-- 场景 2 -->
  <section class="scene" id="s2">
    <div class="wrap">
      <div class="title">跨越山海</div>
      <div class="desc">循着奔赴的轨迹。</div>
      <div class="map-container">
        <div class="point sh" id="shPt">上海</div>
        <div class="point sg" id="sgPt">新加坡</div>
        <div class="line" id="mapLine"></div>
      </div>
      <div class="tip" id="tip2"></div>
    </div>
  </section>

  <!-- 场景 3 -->
  <section class="scene" id="s3">
    <div class="wrap">
      <div class="title">回忆小屋</div>
      <div class="desc">顺着故事发生的顺序点亮它们。</div>
      <div class="item-grid">
        <div class="item" data-index="0">机票</div>
        <div class="item" data-index="1">烧烤</div>
        <div class="item" data-index="2">cos照片</div>
        <div class="item" data-index="3">杭州</div>
        <div class="item" data-index="4">鱼尾狮</div>
      </div>
      <div class="tip" id="tip3"></div>
    </div>
  </section>

  <!-- 场景 4 保险箱 -->
  <section class="scene" id="s4">
    <div class="wrap">
      <div class="title">最后的锁</div>
      <div class="desc">把三个字拼在一起。</div>
      <div class="safe-box">
        <div class="pwd-row">
          <div class="pwd-box" id="p0"></div>
          <div class="pwd-box" id="p1"></div>
          <div class="pwd-box" id="p2"></div>
        </div>
        <div class="btn-group">
          <button onclick="inputPwd()">输入：小幸运</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 结局 -->
  <section class="scene" id="sEnd">
    <div class="wrap">
      <div class="title">答案揭晓</div>
      <div class="desc">终于走到我们的结局。</div>
      < img src="end.jpg" class="end-img" alt="结婚证" />
    </div>
  </section>

  <script>
    const bgm = document.getElementById("bgm");
    let bgmPlayed = false;

    // 雪花
    function createSnow() {
      const flake = document.createElement("div");
      flake.className = "snowflake";
      flake.innerText = "❄";
      flake.style.left = Math.random() * 100 + "%";
      flake.style.animationDuration = (6 + Math.random() * 5) + "s";
      document.body.appendChild(flake);
      setTimeout(() => flake.remove(), 12000);
    }
    setInterval(createSnow, 350);

    // 点击爱心 + 播放 bgm
    document.body.addEventListener("click", (e) => {
      if (!bgmPlayed) {
        bgm.src = "https://audio.jukehost.co.uk/vx6xw5cK8aQbDl0b9wGjRj3yP0vM8l9s";
        bgm.play().catch(() => {});
        bgmPlayed = true;
      }
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "♥";
      heart.style.left = e.clientX + "px";
      heart.style.top = e.clientY + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    });

    // 拖动彩蛋
    let dragStart = false;
    document.addEventListener("mousedown", () => dragStart = true);
    document.addEventListener("mouseup", () => {
      if (dragStart) {
        const modal = document.getElementById("eggModal");
        modal.style.display = "flex";
        setTimeout(() => modal.style.display = "none", 1800);
      }
      dragStart = false;
    });
    document.addEventListener("touchstart", () => dragStart = true);
    document.addEventListener("touchend", () => {
      if (dragStart) {
        const modal = document.getElementById("eggModal");
        modal.style.display = "flex";
        setTimeout(() => modal.style.display = "none", 1800);
      }
      dragStart = false;
    });

    // 切换场景
    function goNext(from, to) {
      document.getElementById(from).classList.remove("active");
      document.getElementById(to).classList.add("active");
    }

    // 场景 1
    document.getElementById("spot1").onclick = () => {
      document.getElementById("tip1").innerText = "第一个字：小";
      setTimeout(() => goNext("s1", "s2"), 1200);
    };

    // 场景 2
    let mapStep = 0;
    const shPt = document.getElementById("shPt");
    const sgPt = document.getElementById("sgPt");
    const mapLine = document.getElementById("mapLine");
    shPt.onclick = () => {
      if (mapStep === 0) {
        shPt.classList.add("active");
        mapStep++;
      }
    };
    sgPt.onclick = () => {
      if (mapStep === 1) {
        sgPt.classList.add("active");
        mapLine.classList.add("show");
        document.getElementById("tip2").innerText = "第二个字：幸";
        setTimeout(() => goNext("s2", "s3"), 1200);
      }
    };

    // 场景 3
    const correctOrder = [0, 1, 2, 3, 4];
    let curStep = 0;
    document.querySelectorAll(".item").forEach(el => {
      el.onclick = () => {
        const idx = Number(el.dataset.index);
        if (idx === correctOrder[curStep]) {
          el.classList.add("correct");
          curStep++;
          if (curStep === 5) {
            document.getElementById("tip3").innerText = "第三个字：运";
            setTimeout(() => goNext("s3", "s4"), 1200);
          }
        }
      };
    });

    // 保险箱
    function inputPwd() {
      document.getElementById("p0").innerText = "小";
      document.getElementById("p1").innerText = "幸";
      document.getElementById("p2").innerText = "运";
      setTimeout(() => goNext("s4", "sEnd"), 900);
    }
  </script>
</body>
</html>
